spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ai-service
  mvc:
    async:
      request-timeout: 60s
  mongodb:
    uri: mongodb://${SPRING_DATA_MONGODB_USERNAME:root}:${SPRING_DATA_MONGODB_PASSWORD:root}@${SPRING_DATA_MONGODB_HOST:localhost}:${SPRING_DATA_MONGODB_PORT:27017}/${SPRING_DATA_MONGODB_DATABASE:ai_db}?authSource=${SPRING_DATA_MONGODB_AUTH_DB:admin}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT}

server:
  port: ${SERVER_PORT}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS}
    ip-address: ${EUREKA_INSTANCE_IP_ADDRESS}
    hostname: ${EUREKA_INSTANCE_HOSTNAME}

auth:
  jwt:
    issuer: ${AUTH_JWT_ISSUER}
    secret: ${AUTH_JWT_SECRET}

ai:
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL}
    embedding-model: ${GEMINI_EMBEDDING_MODEL:text-embedding-004}
    endpoint: ${GEMINI_API_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}
  rag:
    top-k: ${AI_RAG_TOP_K:5}
    max-context-tokens: ${AI_RAG_MAX_CONTEXT_TOKENS:2048}
    max-view-logs: ${AI_RAG_MAX_VIEW_LOGS:5}
    max-messages: ${AI_RAG_MAX_MESSAGES:10}
  retry:
    max-attempts: ${AI_RETRY_MAX_ATTEMPTS:3}
    backoff:
      initial: ${AI_RETRY_BACKOFF_INITIAL:1s}
      max: ${AI_RETRY_BACKOFF_MAX:5s}
  cache:
    query-ttl: ${AI_CACHE_QUERY_TTL:10m}
    context-ttl: ${AI_CACHE_CONTEXT_TTL:30m}
  chat:
    retention:
      enabled: ${AI_CHAT_RETENTION_ENABLED:false}
      message-ttl: ${AI_CHAT_RETENTION_MESSAGE_TTL:30d}
  clients:
    internal-header-name: ${AI_INTERNAL_HEADER_NAME:X-Internal-Api-Key}
    internal-api-key: ${AI_INTERNAL_API_KEY}

resilience4j:
  circuitbreaker:
    instances:
      gemini:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    instances:
      gemini:
        timeoutDuration: 60s
