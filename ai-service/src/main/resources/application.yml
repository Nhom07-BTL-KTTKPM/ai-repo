spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ai-service
  mvc:
    async:
      request-timeout: 180s
  mongodb:
    uri: mongodb://${SPRING_DATA_MONGODB_USERNAME:root}:${SPRING_DATA_MONGODB_PASSWORD:root}@${SPRING_DATA_MONGODB_HOST:localhost}:${SPRING_DATA_MONGODB_PORT:27017}/${SPRING_DATA_MONGODB_DATABASE:ai_db}?authSource=${SPRING_DATA_MONGODB_AUTH_DB:admin}
  datasource:
    url: jdbc:postgresql://${AI_DB_HOST:localhost}:${AI_DB_PORT:5432}/${AI_DB_NAME:ai_db}
    username: ${AI_DB_USERNAME:postgres}
    password: ${AI_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${AI_JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT}

server:
  port: ${SERVER_PORT}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS}
    ip-address: ${EUREKA_INSTANCE_IP_ADDRESS}
    hostname: ${EUREKA_INSTANCE_HOSTNAME}

auth:
  jwt:
    issuer: ${AUTH_JWT_ISSUER}
    secret: ${AUTH_JWT_SECRET}

ai:
  embedding:
    vector-dimension: ${AI_EMBEDDING_VECTOR_DIMENSION:768}
    ollama:
      base-url: ${AI_EMBEDDING_OLLAMA_BASE_URL:http://localhost:11434}
      model: ${AI_EMBEDDING_OLLAMA_MODEL:nomic-embed-text}
      timeout: ${AI_EMBEDDING_OLLAMA_TIMEOUT:30s}
  rag:
    top-k: ${AI_RAG_TOP_K:5}
    max-context-tokens: ${AI_RAG_MAX_CONTEXT_TOKENS:2048}
    max-view-logs: ${AI_RAG_MAX_VIEW_LOGS:5}
    max-messages: ${AI_RAG_MAX_MESSAGES:10}
  retry:
    max-attempts: ${AI_RETRY_MAX_ATTEMPTS:1}
    backoff:
      initial: ${AI_RETRY_BACKOFF_INITIAL:1s}
      max: ${AI_RETRY_BACKOFF_MAX:5s}
  cache:
    query-ttl: ${AI_CACHE_QUERY_TTL:10m}
    context-ttl: ${AI_CACHE_CONTEXT_TTL:30m}
  chat:
    retention:
      enabled: ${AI_CHAT_RETENTION_ENABLED:false}
      message-ttl: ${AI_CHAT_RETENTION_MESSAGE_TTL:30d}
  recommendation:
    top-k: ${AI_RECOMMENDATION_TOP_K:10}
    max-candidates: ${AI_RECOMMENDATION_MAX_CANDIDATES:60}
    min-score: ${AI_RECOMMENDATION_MIN_SCORE:0.2}
    replace-existing: ${AI_RECOMMENDATION_REPLACE_EXISTING:false}
    view-log-limit: ${AI_RECOMMENDATION_VIEW_LOG_LIMIT:20}
    weight-view: ${AI_RECOMMENDATION_WEIGHT_VIEW:0.1}
    weight-click: ${AI_RECOMMENDATION_WEIGHT_CLICK:0.4}
    weight-add-to-cart: ${AI_RECOMMENDATION_WEIGHT_ADD_TO_CART:0.7}
    weight-purchase: ${AI_RECOMMENDATION_WEIGHT_PURCHASE:1.0}
    recency-half-life-days: ${AI_RECOMMENDATION_RECENCY_HALF_LIFE_DAYS:7}
    ai-boost-category: ${AI_RECOMMENDATION_AI_BOOST_CATEGORY:0.05}
    ai-boost-brand: ${AI_RECOMMENDATION_AI_BOOST_BRAND:0.04}
    ai-boost-concern: ${AI_RECOMMENDATION_AI_BOOST_CONCERN:0.06}
    ai-reason-enabled: ${AI_RECOMMENDATION_AI_REASON_ENABLED:true}
    ai-preference-enabled: ${AI_RECOMMENDATION_AI_PREFERENCE_ENABLED:true}
    cleanup-cron: ${AI_RECOMMENDATION_CLEANUP_CRON:0 0 2 * * *}
    cleanup-keep-top: ${AI_RECOMMENDATION_CLEANUP_KEEP_TOP:10}
    cleanup-retention-days: ${AI_RECOMMENDATION_CLEANUP_RETENTION_DAYS:1}
  ollama:
    base-url: ${AI_OLLAMA_BASE_URL:http://localhost:11434}
    model: ${AI_OLLAMA_MODEL:qwen3:4b}
    timeout: ${AI_OLLAMA_TIMEOUT:120s}
  clients:
    internal-header-name: ${AI_INTERNAL_HEADER_NAME:X-Internal-Api-Key}
    internal-api-key: ${AI_INTERNAL_API_KEY}

resilience4j:
  circuitbreaker:
    instances:
      ollama:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    instances:
      ollama:
        timeoutDuration: 120s
